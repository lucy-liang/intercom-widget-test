<!DOCTYPE html>
<html lang="en" class="intercom-hidden">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Intercom Messenger Test</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: #f6f7f9;
      color: #1a1a1a;
    }
    main {
      max-width: 34rem;
      padding: 2.5rem;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.06);
    }
    h1 { font-size: 1.5rem; margin: 0 0 .75rem; }
    p { margin: 0 0 .5rem; line-height: 1.6; color: #444; }
    code { background: #f0f0f3; padding: .1rem .35rem; border-radius: 4px; font-size: .9em; }
    dl { margin: 1.25rem 0 0; font-size: .9rem; }
    dt { font-weight: 600; float: left; clear: left; width: 7rem; color: #666; }
    dd { margin: 0 0 .3rem 7rem; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    button {
      margin-top: 1.5rem;
      padding: .6rem 1.1rem;
      font: inherit;
      font-size: .9rem;
      font-weight: 500;
      color: #fff;
      background: #1f2937;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover { background: #374151; }
    button:active { transform: translateY(1px); }
    button:focus-visible { outline: 2px solid #2781f6; outline-offset: 2px; }

    /* Hard guarantee that the launcher is hidden.
       hide_default_launcher alone is not enough: workspace-level Messenger
       visibility settings can override it, and Intercom injects its launcher
       asynchronously. Targeting its containers directly always wins. */
    html.intercom-hidden #intercom-container,
    html.intercom-hidden #intercom-frame,
    html.intercom-hidden .intercom-lightweight-app,
    html.intercom-hidden .intercom-launcher-frame,
    html.intercom-hidden .intercom-launcher,
    html.intercom-hidden .intercom-namespace .intercom-app {
      display: none !important;
    }

    @media (prefers-color-scheme: dark) {
      button { background: #3b82f6; }
      button:hover { background: #2f6fd8; }
      body { background: #16181d; color: #e8e8ea; }
      main { background: #1f2229; box-shadow: none; }
      p { color: #b3b6bd; }
      code { background: #2a2e37; }
      dt { color: #8b9098; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Intercom messenger test</h1>
    <p>The launcher is <strong>hidden by default</strong>. Press the button to reveal it in the bottom-right corner.</p>
    <p>If nothing appears when you press it, check the console for errors loading <code>widget.intercom.io</code>.</p>
    <dl>
      <dt>app_id</dt><dd>men63xes</dd>
      <dt>user_id</dt><dd>1234567890</dd>
      <dt>name</dt><dd>Lucy</dd>
      <dt>created_at</dt><dd>1785369600</dd>
    </dl>
    <button id="toggle" type="button">Show widget</button>
  </main>

  <script>
    window.intercomSettings = {
      api_base: "https://api-iam.intercom.io",
      app_id: "men63xes",
      user_id: "1234567890",
      name: "Lucy",
      email: "lusayson@gmail.com",
      created_at: 1785369600,
      hide_default_launcher: true
    };
  </script>
  <script>
    // Intercom standard (no-bundler) loader snippet
    (function(){var w=window;var ic=w.Intercom;if(typeof ic==="function"){ic('reattach_activator');ic('update',w.intercomSettings);}else{var d=document;var i=function(){i.c(arguments);};i.q=[];i.c=function(args){i.q.push(args);};w.Intercom=i;var l=function(){var s=d.createElement('script');s.type='text/javascript';s.async=true;s.src='https://widget.intercom.io/widget/men63xes';var x=d.getElementsByTagName('script')[0];x.parentNode.insertBefore(s,x);};if(document.readyState==='complete'){l();}else if(w.attachEvent){w.attachEvent('onload',l);}else{w.addEventListener('load',l,false);}}})();
  </script>

  <script>
    // Two mechanisms on purpose:
    //   1. the `intercom-hidden` class on <html> — CSS, always wins, no flash
    //   2. Intercom('update', ...) — keeps Intercom's own state in sync
    // Neither is reliable alone: the API call can be overridden by workspace
    // settings, and CSS alone leaves Intercom thinking the launcher is visible.
    (function () {
      var hidden = true; // matches the class on <html> and hide_default_launcher
      var root = document.documentElement;
      var btn = document.getElementById('toggle');

      btn.addEventListener('click', function () {
        hidden = !hidden;
        root.classList.toggle('intercom-hidden', hidden);
        window.Intercom('update', { hide_default_launcher: hidden });
        btn.textContent = hidden ? 'Show widget' : 'Hide widget';
      });
    })();
  </script>
</body>
</html>
