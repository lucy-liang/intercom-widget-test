<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Intercom Messenger Test</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: #f6f7f9;
      color: #1a1a1a;
    }
    main {
      max-width: 34rem;
      padding: 2.5rem;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.06);
    }
    h1 { font-size: 1.5rem; margin: 0 0 .75rem; }
    p { margin: 0 0 .5rem; line-height: 1.6; color: #444; }
    code { background: #f0f0f3; padding: .1rem .35rem; border-radius: 4px; font-size: .9em; }
    dl { margin: 1.25rem 0 0; font-size: .9rem; }
    dt { font-weight: 600; float: left; clear: left; width: 7rem; color: #666; }
    dd { margin: 0 0 .3rem 7rem; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    @media (prefers-color-scheme: dark) {
      body { background: #16181d; color: #e8e8ea; }
      main { background: #1f2229; box-shadow: none; }
      p { color: #b3b6bd; }
      code { background: #2a2e37; }
      dt { color: #8b9098; }
    }
  </style>
</head>
<body>
  <main>

    <p>If it doesn't, check the console for errors loading <code>widget.intercom.io</code>.</p>
    <dl>
      <dt>app_id</dt><dd>men63xes</dd>

</html>
